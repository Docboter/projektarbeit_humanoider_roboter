services:
  unitree-simulation:
    image: ${SIM_IMAGE:-unitree-g1-simulation:latest}
    build:
      context: ..
      dockerfile: docker/simulation/Dockerfile
    network_mode: host
    ipc: host
    shm_size: "16gb"
    gpus: all
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: ${PRIVACY_CONSENT:-N}
      NVIDIA_VISIBLE_DEVICES: ${SIM_GPU:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      LIVESTREAM_TYPE: ${LIVESTREAM_TYPE:-2}
      UNITREE_TASK: ${UNITREE_TASK:-Isaac-Stack-RgyBlock-G129-Dex3-Joint}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-480}
      EPISODE_LENGTH_S: ${EPISODE_LENGTH_S:-3600}
      UNITREE_SIM_EXTRA_ARGS: ${UNITREE_SIM_EXTRA_ARGS:-}
    volumes:
      - ${UNITREE_ASSETS_DIR:-../repos/unitree_sim_isaaclab/assets}:/workspace/unitree_sim_isaaclab/assets:ro
      - isaac_cache:/root/.cache/ov
      - isaac_computecache:/root/.nv/ComputeCache
      - isaac_logs:/root/.nvidia-omniverse/logs
      - isaac_data:/root/.local/share/ov/data
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  isaac_cache:
  isaac_computecache:
  isaac_logs:
  isaac_data:
