# TL;DR: Optionale Dev-Variante mit Host-Bind-Mounts; fuer den taeglichen Betrieb nicht noetig.
# Optionale Dev-Variante — fuer den taeglichen Betrieb NICHT noetig.
# Das Image ist autonom: `docker run lucam03/projekt-humanoider-roboter:latest`
# (Konto per DOCKER_NAMESPACE, Default lucam03 — eigenes Konto fuer selbst gebaute Images)
# (oder ./setup_and_train_dockerhub_pull.sh) startet alles selbst.
#
# Diese Datei ist nur fuer lokale Entwicklung gedacht, wenn du Skripte und Daten
# vom Host bind-mounten willst statt das Image neu zu bauen.
#
# Bewusst KEIN `restart: always` und KEINE persistenten Volumes auf dem Host —
# der Container-Filesystem ist die einzige Wahrheit (vast.ai-kompatibles Modell).
# Wenn du den Container loeschst, sind Daten + Checkpoints weg.
# ACHTUNG: `docker compose down` LOESCHT den Container (und damit /data samt Checkpoints)!
# Anhalten/fortsetzen nur mit `docker compose stop` / `docker compose start`; vorher Checkpoints
# per `docker cp groot-train:/data/g1_dex3_finetune ./checkpoints` sichern.
#
# Aufruf:
#   docker compose up                 # autonomer Lauf
#   docker compose run --rm groot-training bash   # Shell
services:
  groot-training:
    # Ein Image je GR00T-Generation: :latest = N1.6, :latest-n17 = N1.7 (GROOT_IMAGE_TAG setzt
    # setup_and_train_container_build.sh passend zu GROOT_VERSION).
    # ACHTUNG bei direktem `docker compose`: der Tag folgt GROOT_VERSION NICHT automatisch
    # (compose kann nicht bedingt interpolieren). GROOT_VERSION=1.7 ohne GROOT_IMAGE_TAG zieht
    # :latest (nur N1.6) und bricht ab — fuer N1.7 also immer beide setzen:
    #   GROOT_VERSION=1.7 GROOT_IMAGE_TAG=latest-n17 docker compose up
    image: ${DOCKER_NAMESPACE:-lucam03}/projekt-humanoider-roboter:${GROOT_IMAGE_TAG:-latest}
    container_name: groot-train
    runtime: nvidia
    ipc: host
    shm_size: "16gb"
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN
      - WANDB_API_KEY
      - MAX_STEPS
      - GLOBAL_BATCH_SIZE
      - NUM_GPUS
      - WANDB_PROJECT
      - GROOT_VERSION   # 1.6 (Default) | 1.7 — siehe Training/scripts/lib_groot_version.sh
      # Bis 2026-10-13 endete die Liste hier — Verfahrens-Schalter und Lauf-Parameter kamen
      # ueber compose nie im Container an (Review T5). Gleiche Auswahl wie
      # setup_and_train_dockerhub_pull.sh. Ohne Wert gelistet = nur durchgereicht, wenn auf dem
      # Host gesetzt; sonst gelten die Defaults aus Dockerfile/entrypoint.sh.
      # DATA_DIR/WANDB_DIR bewusst NICHT: das sind Container-Pfade (Review T3).
      - TUNE_VISUAL
      - USE_COTRAIN
      - COTRAIN_MIX_RATIO
      - COTRAIN_DATASET_PATH
      - COTRAIN_HF_REPO
      - TRAIN_TEST_SPLIT
      - TRAIN_SPLIT_RATIO
      - USE_AUGMENTATION
      - USE_RL
      - SKIP_DOWNLOAD
      - SKIP_CONVERT
      - SKIP_TRAIN
      - SHELL_ON_ERROR
      - WANDB_MODE
      - SAVE_STEPS
      - SAVE_TOTAL_LIMIT
      - LEARNING_RATE
      - WARMUP_RATIO
      - WEIGHT_DECAY
      - DATALOADER_WORKERS
      - GRADIENT_ACCUMULATION_STEPS
      - OUTPUT_DIR
      - EXPERIMENT_NAME
      - RESUME
      - CJ_BRIGHTNESS
      - CJ_CONTRAST
      - CJ_SATURATION
      - CJ_HUE
      - RANDOM_ROTATION_ANGLE
      - STATE_DROPOUT_PROB
    # Passend zur Generation: im :latest-n17-Image ist /app/Groot-1.6 leer (Review 5.2c).
    working_dir: /app/Groot-${GROOT_VERSION:-1.6}
