services:
  groot-training:
    build: .
    image: projektarbeit-humanoider-roboter:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /app/Groot-1.6
