model:
  name: groot_1_7
  pretrained_path: /models/groot1.7.pt
  device: cuda

data:
  data_dir: /data/processed
  seq_length: 32
  batch_size: 8
  num_workers: 4

training:
  epochs: 20
  lr: 1e-4
  weight_decay: 1e-5

  checkpoint_dir: /checkpoints
  output_dir: /output

  log_interval: 10
  save_interval: 1

robot:
  action_dim: 12